    <g transform="translate(34 30)">
      <g><rect width="692" height="190" rx="17" fill="#0A0F18" stroke="#29364D"/><text x="24" y="34" fill="#7185A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2.2">01 / ROLE</text><circle cx="30" cy="76" r="6" fill="#43E7F4" fill-opacity=".14" stroke="#43E7F4"/><text x="48" y="84" fill="#E8EEFA" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">AI delivery / product craft</text><text x="24" y="124" fill="#9DAEC8" font-family="Inter, system-ui, sans-serif" font-size="20">Turning ambiguous ideas into clear, useful</text><text x="24" y="151" fill="#9DAEC8" font-family="Inter, system-ui, sans-serif" font-size="20">systems people can actually use.</text></g>
      <g transform="translate(0 208)"><rect width="692" height="225" rx="17" fill="#0A0F18" stroke="#29364D"/><text x="24" y="34" fill="#7185A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2.2">02 / CURRENT PRODUCTS</text><text x="24" y="75" fill="#E8EEFA" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Three focused product systems</text>
        <g transform="translate(24 96)" font-family="ui-monospace, monospace" font-size="16"><rect width="644" height="38" rx="10" fill="#0E1621" stroke="#2B384F"/><circle cx="20" cy="19" r="4" fill="#55E6D0"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle><text x="36" y="25" fill="#C2CEE0">SYLEPSE / AMBIENT AVIATION</text><rect y="48" width="644" height="38" rx="10" fill="#0E1621" stroke="#2B384F"/><circle cx="20" cy="67" r="4" fill="#B78CFF"/><text x="36" y="73" fill="#C2CEE0">ALAN DB / CINEMA SYSTEM</text><rect y="96" width="644" height="38" rx="10" fill="#0E1621" stroke="#2B384F"/><circle cx="20" cy="115" r="4" fill="#F3C86A"/><text x="36" y="121" fill="#C2CEE0">RARENESS / COLLECTION UX</text></g>
      </g>
      <g transform="translate(0 451)"><rect width="692" height="189" rx="17" fill="#0A0F18" stroke="#29364D"/><text x="24" y="34" fill="#7185A5" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2.2">03 / OPERATING MODE</text><text x="24" y="75" fill="#E8EEFA" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700">Clarity over noise.</text><g fill="#ACBBD2" font-family="Inter, system-ui, sans-serif" font-size="19"><text x="54" y="112">Frame the right problem</text><text x="54" y="145">Prototype the real behavior</text><text x="54" y="178">Ship, observe, sharpen</text></g><path d="M25 103L33 111L44 98" stroke="#67E8F9" stroke-width="3"/><path d="M25 136L33 144L44 131" stroke="#8FA0FF" stroke-width="3"/><path d="M25 169L33 177L44 164" stroke="#C58AFF" stroke-width="3"/></g>
