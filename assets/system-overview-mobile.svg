<svg width="760" height="700" viewBox="0 0 760 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile overview</title><desc id="desc">Role, current products, and operating principles.</desc>
