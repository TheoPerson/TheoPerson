<svg width="760" height="520" viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Théo Person — AI Project Manager</title>
  <desc id="desc">Mobile profile banner for an AI project manager and product builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#080B11"/><stop offset=".6" stop-color="#0C1220"/><stop offset="1" stop-color="#160D25"/></linearGradient>
    <linearGradient id="accent" x1="38" y1="18" x2="720" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#43E7F4"/><stop offset=".5" stop-color="#7C8CFF"/><stop offset="1" stop-color="#C47CFF"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(650 60) rotate(135) scale(350 300)"><stop stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#9CB4D8" stroke-opacity=".055"/></pattern>
    <clipPath id="clip"><rect width="760" height="520" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="760" height="520" fill="url(#bg)"/><rect width="760" height="520" fill="url(#grid)"/><rect width="760" height="520" fill="url(#glow)"/>
    <g transform="translate(46 42)">
      <circle cx="5" cy="5" r="5" fill="#5EEAD4"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="21" y="10" fill="#7F91AE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2">PROFILE / ONLINE</text>
    </g>
    <g transform="translate(46 112)">
      <text fill="#8191AE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3.4">THÉO PERSON / JUG</text>
      <text y="64" fill="#F4F7FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="760" letter-spacing="-1.8">AI PROJECT MANAGER</text>
      <text y="108" fill="#B0BDD5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">From signal to shipped system.</text>
      <g transform="translate(0 146)">
        <rect width="668" height="92" rx="14" fill="#080C13" fill-opacity=".86" stroke="#2B3650"/>
        <circle cx="23" cy="23" r="4" fill="#FF7B72"/><circle cx="40" cy="23" r="4" fill="#D6A84B"/><circle cx="57" cy="23" r="4" fill="#42C86A"/>
        <text x="23" y="62" fill="#D8E1F2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">&gt; llm · data · product · web</text>
        <rect x="346" y="46" width="10" height="22" rx="1" fill="#9DB2FF"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.43;.5;.93;1" dur="1.15s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <g transform="translate(610 418)">
      <circle r="55" stroke="#43506B" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/></circle>
      <circle r="31" stroke="url(#accent)" stroke-opacity=".7" stroke-dasharray="36 14"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="5" fill="#C3CEFF"/><path d="M0 0L38-38" stroke="#7C8CFF"/>
    </g>
    <text x="46" y="446" fill="#7184A2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="2">FRANCE / UK · UTC+01</text>
    <rect x="1" y="1" width="758" height="518" rx="27" stroke="#394662" stroke-width="2"/><rect x="1" y="1" width="758" height="518" rx="27" stroke="url(#accent)" stroke-width="2" stroke-dasharray="180 1180"><animate attributeName="stroke-dashoffset" values="1360;0" dur="10s" repeatCount="indefinite"/></rect>
  </g>
</svg>

