<svg width="1200" height="118" viewBox="0 0 1200 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Build with intent. Ship with clarity.</title>
  <desc id="desc">Closing statement for a product builder's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="118" gradientUnits="userSpaceOnUse"><stop stop-color="#080C13"/><stop offset="1" stop-color="#0D101B"/></linearGradient>
    <linearGradient id="accent" x1="70" y1="59" x2="1130" y2="59" gradientUnits="userSpaceOnUse"><stop stop-color="#43E7F4" stop-opacity="0"/><stop offset="0.26" stop-color="#43E7F4"/><stop offset="0.55" stop-color="#8192FF"/><stop offset="0.78" stop-color="#C27CFF"/><stop offset="1" stop-color="#C27CFF" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="118" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="118" fill="url(#bg)"/>
    <path d="M54 59H390M810 59H1146" stroke="#27334A"/>
    <path d="M54 59H390" stroke="url(#accent)" stroke-width="2" stroke-dasharray="84 252"><animate attributeName="stroke-dashoffset" values="336;0" dur="4.5s" repeatCount="indefinite"/></path>
    <path d="M810 59H1146" stroke="url(#accent)" stroke-width="2" stroke-dasharray="84 252"><animate attributeName="stroke-dashoffset" values="0;336" dur="4.5s" repeatCount="indefinite"/></path>
    <text x="600" y="52" text-anchor="middle" fill="#E9EEF9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.4">BUILD WITH INTENT.</text>
    <text x="600" y="77" text-anchor="middle" fill="#8497B5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2.5">SHIP WITH CLARITY.</text>
    <circle cx="402" cy="59" r="3" fill="#57E4EC"><animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="798" cy="59" r="3" fill="#B685FF"><animate attributeName="opacity" values="1;.25;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <rect x="1" y="1" width="1198" height="116" rx="19" stroke="#303C54" stroke-width="2"/>
  </g>
</svg>
